name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests unitaires
        run: npm test

      - name: Garde-fou — aucun fichier de données versionné
        run: |
          bad=$(git ls-files | grep -Ei '\.(xlsx|xls|csv|pdf)$|(^|/)data[^/]*\.json$|(^|/)Suivi-PV/' | grep -v '^exemple-abraxio\.xlsx$' || true)
          if [ -n "$bad" ]; then echo "Fichiers interdits dans le dépôt :"; echo "$bad"; exit 1; fi

      - name: Préparation du site (fichiers de l'application uniquement)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js version.js CHANGELOG.md exemple-abraxio.xlsx css js vendor icons _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
