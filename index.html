<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Aucune requête réseau hors de l'application elle-même : les données restent sur le poste. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Suivi PV</title>
  <meta name="description" content="Suivi mensuel des PV fournisseurs — données strictement locales.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="24" height="24"><span>Suivi PV</span></div>
    <div id="toolbar" class="toolbar" hidden>
      <button id="btnImport" type="button" class="btn btn-primary" data-icon="upload">Importer Abraxio</button>
      <button id="btnExport" type="button" class="btn" data-icon="download">Exporter</button>
      <button id="btnAddLine" type="button" class="btn" data-icon="plus">Nouvelle ligne</button>
      <button id="btnSettings" type="button" class="btn btn-ghost" data-icon="settings">Paramètres</button>
    </div>
  </header>

  <div id="updateBanner" class="banner banner-update" role="status" hidden></div>
  <div id="readonlyBanner" class="banner banner-warn" role="alert" hidden></div>

  <main>
    <section id="welcome" class="welcome" hidden></section>

    <section id="dashboard" hidden>
      <div class="filters" id="filters">
        <div class="search">
          <input id="search" type="search" class="control" placeholder="Rechercher : collaborateur, commande, BR…" aria-label="Rechercher">
        </div>
        <select id="filterAnnee" class="control" aria-label="Année"></select>
        <span id="filterMois"></span>
        <span id="filterFournisseurs"></span>
        <span id="filterStatuts"></span>
        <label id="filterAlertesWrap" class="toggle" hidden><input id="filterAlertes" type="checkbox"><span id="filterAlertesLabel">Alertes Abraxio</span></label>
        <button id="filterReset" type="button" class="btn btn-ghost btn-sm" hidden>Réinitialiser</button>
      </div>

      <div id="summary" class="summary"></div>
      <div id="todo" class="todo"></div>

      <div class="table-wrap">
        <table class="grid lines">
          <thead><tr id="linesHead"></tr></thead>
          <tbody id="linesBody"></tbody>
        </table>
      </div>
      <p class="hint"><span id="resultCount"></span> Glissez-déposez le PDF d'un PV sur la ligne du collaborateur.</p>
    </section>
  </main>

  <footer class="footer">
    <span>Suivi PV <span id="appVersion"></span></span>
    <span id="saveStatus" class="save-status"></span>
    <span id="folderName"></span>
  </footer>

  <script src="version.js"></script>
  <script src="vendor/xlsx.full.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
