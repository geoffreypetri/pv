<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Aucune requête réseau hors de l'application elle-même : les données restent sur le poste. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Suivi PV</title>
  <meta name="description" content="Suivi mensuel des PV fournisseurs — données strictement locales.">
  <meta name="theme-color" content="#1f4e79">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Suivi PV</span></div>
    <div id="toolbar" class="toolbar" hidden>
      <div class="month-nav" role="group" aria-label="Mois">
        <button id="monthPrev" type="button" class="icon-btn" title="Mois précédent" aria-label="Mois précédent">◀</button>
        <select id="monthSelect" aria-label="Mois affiché"></select>
        <button id="monthNext" type="button" class="icon-btn" title="Mois suivant" aria-label="Mois suivant">▶</button>
      </div>
      <div class="toolbar-actions">
        <button id="btnImport" type="button" class="btn btn-primary">Importer Abraxio…</button>
        <button id="btnAddLine" type="button" class="btn">Ajouter une ligne</button>
        <button id="btnExport" type="button" class="btn">Exporter Excel</button>
        <button id="btnSettings" type="button" class="btn btn-ghost" title="Paramètres">⚙ Paramètres</button>
      </div>
    </div>
    <button id="btnInstall" type="button" class="btn btn-install" hidden>Installer l'application</button>
  </header>

  <div id="updateBanner" class="banner banner-update" role="status" hidden></div>
  <div id="readonlyBanner" class="banner banner-warn" role="alert" hidden></div>

  <main>
    <section id="welcome" class="welcome" hidden></section>

    <section id="dashboard" hidden>
      <div id="counters" class="counters"></div>
      <div id="todo" class="todo"></div>
      <div class="filters">
        <input id="search" type="search" placeholder="Rechercher (collaborateur, commande, BR…)" aria-label="Rechercher">
        <select id="filterFournisseur" aria-label="Fournisseur"></select>
        <select id="filterStatut" aria-label="Statut"></select>
        <button id="filterReset" type="button" class="btn btn-ghost btn-small" hidden>Effacer les filtres</button>
        <span id="resultCount" class="muted small"></span>
      </div>
      <div class="table-wrap">
        <table class="grid lines">
          <thead>
            <tr>
              <th>Collaborateur</th><th>Fournisseur</th><th>Commande</th>
              <th class="num">Attendu</th><th class="num">Montant PV</th><th class="num">Écart</th>
              <th>Statut</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="linesBody"></tbody>
        </table>
      </div>
      <p class="hint">Astuce : glissez-déposez le PDF d'un PV directement sur la ligne du collaborateur.</p>
    </section>
  </main>

  <footer class="footer">
    <span>Suivi PV <span id="appVersion"></span></span>
    <span id="saveStatus" class="save-status"></span>
    <span id="folderName"></span>
  </footer>

  <script src="version.js"></script>
  <script src="vendor/xlsx.full.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
